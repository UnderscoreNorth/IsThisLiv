version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: isthisliv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-isthisliv}
      MYSQL_USER: ${MYSQL_USER:-isthisliv_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - isthisliv-network

  # Express Backend
  express:
    build:
      context: ./express
      dockerfile: Dockerfile
    container_name: isthisliv-express
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      NODE_ENV: development
      # Database configuration - automatically injected from .env
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER:-isthisliv_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-password}
      DB_NAME: ${MYSQL_DATABASE:-isthisliv}
      # Application configuration
      PORT: 3000
      SALT: ${SALT:-defaultsalt}
    ports:
      - "${EXPRESS_PORT:-3000}:3000"
    volumes:
      # Mount source code for hot-reload in dev mode
      - ./express/src:/app/src
      - ./express/cache:/app/cache
      - ./express/uploads:/app/uploads
      # Prevent overwriting node_modules
      - /app/node_modules
    networks:
      - isthisliv-network

  # Svelte Frontend
  svelte:
    build:
      context: ./svelte
      dockerfile: Dockerfile
    container_name: isthisliv-svelte
    restart: unless-stopped
    depends_on:
      - express
    environment:
      NODE_ENV: development
      # Frontend configuration - VITE_ prefix required for public env vars
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
      VITE_BOORU_URL: ${VITE_BOORU_URL:-https://isthisliv.com/booru/}
    ports:
      - "${SVELTE_PORT:-5173}:5173"
    volumes:
      # Mount source code for hot-reload in dev mode
      - ./svelte/src:/app/src
      - ./svelte/static:/app/static
      - ./svelte/svelte.config.js:/app/svelte.config.js
      - ./svelte/vite.config.js:/app/vite.config.js
      - ./svelte/tsconfig.json:/app/tsconfig.json
      # Prevent overwriting node_modules
      - /app/node_modules
    networks:
      - isthisliv-network

volumes:
  mysql_data:
    driver: local

networks:
  isthisliv-network:
    driver: bridge
